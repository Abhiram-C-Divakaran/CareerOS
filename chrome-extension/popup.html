<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CareerOS Portal Companion</title>
    <style>
      body {
        width: 340px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #090d16;
        color: #f8fafc;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #1e293b;
      }
      .brand {
        font-weight: 700;
        font-size: 15px;
        color: #38bdf8;
      }
      .badge {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        background: #1e293b;
        color: #94a3b8;
      }
      label {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #94a3b8;
        margin-top: 10px;
        margin-bottom: 4px;
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid #334155;
        background: #0f172a;
        color: #f8fafc;
        font-size: 13px;
      }
      button {
        width: 100%;
        margin-top: 14px;
        padding: 10px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(135deg, #0284c7, #2563eb);
        color: white;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.95;
      }
      #statusMsg {
        margin-top: 10px;
        font-size: 12px;
        color: #34d399;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <span class="brand">CareerOS Companion</span>
      <span class="badge">User-Authorized</span>
    </div>

    <label>Company</label>
    <input id="company" type="text" placeholder="e.g. Amazon, TCS, Wipro, Infosys" />

    <label>Role / Job Title</label>
    <input id="role" type="text" placeholder="e.g. Software Development Engineer I" />

    <label>Career Portal</label>
    <select id="portal">
      <option value="Amazon Careers">Amazon Careers</option>
      <option value="TCS NextStep">TCS NextStep</option>
      <option value="Wipro Careers">Wipro Careers</option>
      <option value="Infosys">Infosys</option>
      <option value="Accenture">Accenture</option>
      <option value="LinkedIn">LinkedIn</option>
      <option value="Indeed">Indeed</option>
      <option value="Naukri">Naukri</option>
      <option value="Company Website">Company Website</option>
    </select>

    <label>Portal Application / Requisition ID</label>
    <input id="portalApplicationId" type="text" placeholder="e.g. AMZN-REQ-2849103 or CT2026..." />

    <label>Current Portal Status</label>
    <select id="status">
      <option value="APPLIED">Applied</option>
      <option value="UNDER_REVIEW">Under Review</option>
      <option value="ASSESSMENT">Assessment</option>
      <option value="INTERVIEW">Interview</option>
      <option value="OFFER">Offer</option>
      <option value="REJECTED">Rejected</option>
    </select>

    <label>Source URL</label>
    <input id="sourceUrl" type="url" placeholder="https://..." />

    <button id="captureBtn">Save to CareerOS</button>
    <div id="statusMsg"></div>

    <script src="popup.js"></script>
  </body>
</html>
